<ion-card>
  <img
    alt="Silhouette of mountains"
    src="https://ionicframework.com/docs/img/demos/card-media.png"
  />
  <ion-card-header>
    <ion-card-title>Daily Summary</ion-card-title>
  </ion-card-header>

  <ion-card-content *ngIf="dailySummary">
    {{ dailySummary.dailyTotalCount }} /
    {{ dailySummary.targetTotalCount }}
  </ion-card-content>
</ion-card>
