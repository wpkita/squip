<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Habits</ion-title>
    <ion-buttons slot="end">
      <ion-button id="open-add-habit-modal">
        <ion-icon slot="icon-only" name="add-circle"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <app-daily-summary></app-daily-summary>
  <ion-list #habitsList class="habits-list">
    <ion-item-sliding *ngFor="let habitSummary of habitSummaries">
      <ion-item>
        <ion-label>{{habitSummary.habit.name}}</ion-label>
        <ion-badge *ngIf="habitSummary.count > 0"
          >{{habitSummary.count}}</ion-badge
        >
      </ion-item>

      <ion-item-options side="start">
        <ion-item-option
          color="success"
          (click)="track(habitSummary, habitsList)"
        >
          <ion-icon slot="icon-only" name="checkmark"></ion-icon>
        </ion-item-option>
      </ion-item-options>
      <ion-item-options side="end">
        <ion-item-option
          color="warning"
          (click)="edit(habitSummary.habit, habitsList)"
        >
          <ion-icon slot="icon-only" name="pencil"></ion-icon>
        </ion-item-option>
        <ion-item-option
          color="danger"
          (click)="delete(habitSummary.habit, habitsList)"
        >
          <ion-icon slot="icon-only" name="trash"></ion-icon>
        </ion-item-option>
      </ion-item-options>
    </ion-item-sliding>
  </ion-list>

  <ion-modal trigger="open-add-habit-modal" (willDismiss)="dismissAdd($event)">
    <ng-template>
      <ion-header>
        <ion-toolbar>
          <ion-buttons slot="start">
            <ion-button (click)="cancelAdd()">Cancel</ion-button>
          </ion-buttons>
          <ion-title>New Habit</ion-title>
          <ion-buttons slot="end">
            <ion-button (click)="confirmAdd()" [strong]="true"
              >Confirm</ion-button
            >
          </ion-buttons>
        </ion-toolbar>
      </ion-header>
      <ion-content class="ion-padding">
        <ion-item>
          <ion-label position="stacked">Enter a habit name</ion-label>
          <ion-input
            type="text"
            placeholder="Your habit name"
            [(ngModel)]="newHabitName"
          ></ion-input>
        </ion-item>
      </ion-content>
    </ng-template>
  </ion-modal>
</ion-content>
