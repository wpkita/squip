<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Moods</ion-title>
    <ion-buttons slot="end">
      <ion-button id="open-add-mood-modal">
        <ion-icon slot="icon-only" name="add-circle"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let moodEntry of moodEntries">
      <ion-label position="stacked">{{moodEntry.mood.name}}</ion-label>
      <ion-range [(ngModel)]="moodEntry.magnitude"></ion-range>
    </ion-item>
  </ion-list>
  <ion-button expand="block" (click)="checkIn(moodEntries)">Check In</ion-button>

  <ion-modal trigger="open-add-mood-modal" (willDismiss)="dismissAdd($event)">
    <ng-template>
      <ion-header>
        <ion-toolbar>
          <ion-buttons slot="start">
            <ion-button (click)="cancelAdd()">Cancel</ion-button>
          </ion-buttons>
          <ion-title>New Mood</ion-title>
          <ion-buttons slot="end">
            <ion-button (click)="confirmAdd()" [strong]="true">Confirm</ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>
      <ion-content class="ion-padding">
        <ion-item>
          <ion-label position="stacked">Enter a mood name</ion-label>
          <ion-input type="text" placeholder="Your mood name" [(ngModel)]="newMoodName"></ion-input>
        </ion-item>
      </ion-content>
    </ng-template>
  </ion-modal>
</ion-content>
