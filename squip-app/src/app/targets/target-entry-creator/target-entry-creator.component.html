<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button color="medium" (click)="cancel()">Cancel</ion-button>
    </ion-buttons>
    <ion-title>Track a Target</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="confirm()">Confirm</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding">
  <ion-item>
    <ion-label position="stacked">Target</ion-label>
    <p>{{name}}</p>
  </ion-item>
  <ion-item>
    <ion-label position="stacked">Urge intensity</ion-label>
    <ion-range [(ngModel)]="magnitude"></ion-range>
  </ion-item>
  <ion-item>
    <ion-label position="stacked">Engaged in target?</ion-label>
    <ion-toggle [(ngModel)]="didEngage" slot="end"></ion-toggle>
  </ion-item>
</ion-content>
