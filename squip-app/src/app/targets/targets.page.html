<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Targets</ion-title>
    <ion-buttons slot="end">
      <ion-button id="open-add-target-modal">
        <ion-icon slot="icon-only" name="add-circle"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list #targetsList>
    <ion-item-sliding *ngFor="let targetSummary of targetSummaries">
      <ion-item>
        <ion-label>{{targetSummary.target.name}}</ion-label>
        <ion-badge *ngIf="targetSummary.count > 0">{{targetSummary.count}}</ion-badge>
      </ion-item>

      <ion-item-options side="start">
        <ion-item-option color="danger" (click)="track(targetSummary.target, targetsList)">
          <ion-icon slot="icon-only" name="checkmark"></ion-icon>
        </ion-item-option>
      </ion-item-options>
    </ion-item-sliding>
  </ion-list>

  <!-- <ion-modal trigger="open-track-target-modal" (willDismiss)="dismissTrack($event)">

  </ion-modal> -->

  <!-- -->
  <ion-modal trigger="open-add-target-modal" (willDismiss)="dismissAdd($event)">
    <ng-template>
      <ion-header>
        <ion-toolbar>
          <ion-buttons slot="start">
            <ion-button (click)="cancelAdd()">Cancel</ion-button>
          </ion-buttons>
          <ion-title>New Target</ion-title>
          <ion-buttons slot="end">
            <ion-button (click)="confirmAdd()" [strong]="true">Confirm</ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>
      <ion-content class="ion-padding">
        <ion-item>
          <ion-label position="stacked">Enter a target name</ion-label>
          <ion-input type="text" placeholder="Your target name" [(ngModel)]="newTargetName"></ion-input>
        </ion-item>
      </ion-content>
    </ng-template>
  </ion-modal>
</ion-content>
